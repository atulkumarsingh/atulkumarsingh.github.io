<footer class="py-12 border-t border-gh-border-dark bg-gh-inset-dark">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 text-center">
        <div class="flex flex-wrap justify-center gap-6 mb-6">
            <a href="{{ '/privacy-policy/' | relative_url }}" class="text-sm text-gh-muted-dark hover:text-gh-fg-dark">Privacy
                Policy</a>
            <a href="{{ '/terms/' | relative_url }}" class="text-sm text-gh-muted-dark hover:text-gh-fg-dark">Terms</a>
            <a href="{{ '/contact/' | relative_url }}" class="text-sm text-gh-muted-dark hover:text-gh-fg-dark">Contact</a>
        </div>
        <p class="text-sm text-gh-muted-dark">© {{ 'now' | date: "%Y" }} {{ site.title }}. All rights reserved.</p>
    </div>
</footer>

<script src="{{ '/assets/js/calendar.js' | relative_url }}"></script>
<script>
    // Reveal Animations
    const observerOptions = {
        threshold: 0.1,
        rootMargin: '0px 0px -50px 0px'
    };

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('active');
            }
        });
    }, observerOptions);

    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

    // Mobile Menu Toggle
    const menuBtn = document.getElementById('mobile-menu-button');
    const mobileMenu = document.getElementById('mobile-menu');

    menuBtn?.addEventListener('click', () => {
        mobileMenu.classList.toggle('hidden');
        const icon = menuBtn.querySelector('.material-symbols-outlined');
        if (icon) icon.textContent = mobileMenu.classList.contains('hidden') ? 'menu' : 'close';
    });

    // Close menu on link click
    mobileMenu?.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => {
            mobileMenu.classList.add('hidden');
            const icon = menuBtn.querySelector('.material-symbols-outlined');
            if (icon) icon.textContent = 'menu';
        });
    });
</script>
