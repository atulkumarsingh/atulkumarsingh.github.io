<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description"
        content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ '/assets/images/favicon.ico' | relative_url }}" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
            rel="stylesheet" />
    </noscript>

    <!-- Icons -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Custom CSS (compiled) -->
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

    <!-- Tailwind (Using CDN for now as in original, but ideal to build step if needed later) -->
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "gh-canvas": "#ffffff",
                        "gh-canvas-subtle": "#f6f8fa",
                        "gh-border": "#d0d7de",
                        "gh-border-muted": "#d8dee4",
                        "gh-fg": "#1f2328",
                        "gh-fg-muted": "#656d76",
                        "gh-canvas-dark": "#0d1117",
                        "gh-canvas-subtle-dark": "#161b22",
                        "gh-subtle-dark": "#21262d",
                        "gh-inset-dark": "#010409",
                        "gh-border-dark": "#30363d",
                        "gh-fg-dark": "#e6edf3",
                        "gh-muted-dark": "#8b949e",
                        "gh-accent": "#2f81f7",
                        "gh-green": "#238636",
                        "gh-purple": "#a371f7",
                        "gh-yellow": "#d29922",
                        "gh-red": "#f85149",
                        "gh-orange": "#d29922"
                    },
                    borderRadius: {
                        "gh": "6px",
                    },
                    fontFamily: {
                        sans: ["Inter", "-apple-system", "BlinkMacSystemFont", "Segoe UI", "Helvetica", "Arial", "sans-serif"],
                        mono: ["'JetBrains Mono'", "SFMono-Regular", "Consolas", "'Liberation Mono'", "Menlo", "monospace"],
                    }
                }
            }
        };
    </script>
</head>
