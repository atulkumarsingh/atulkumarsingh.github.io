---
layout: default
---

<!-- Hero Section for Landing Pages -->
<section class="relative pt-20 pb-16 md:pt-28 md:pb-24 overflow-hidden bg-gh-canvas-dark border-b border-gh-border-dark">
    <div class="max-w-6xl mx-auto px-4 sm:px-6">
        <div class="max-w-3xl mx-auto text-center reveal">
            <h1 class="text-4xl md:text-5xl lg:text-6xl font-extrabold text-gh-fg-dark mb-6 tracking-tight">
                {{ page.title }}
            </h1>
            {% if page.subtitle %}
            <p class="text-xl md:text-2xl text-gh-accent mb-6 font-medium">
                {{ page.subtitle }}
            </p>
            {% endif %}
            <p class="text-lg text-gh-muted-dark leading-relaxed mb-10 max-w-2xl mx-auto">
                {{ page.description }}
            </p>
            <div class="flex justify-center gap-4">
                <a href="javascript:void(0)" class="open-calendar px-6 py-3 bg-gh-accent hover:bg-gh-accent/90 text-white font-bold rounded-xl transition-all shadow-lg shadow-gh-accent/20">
                    Get Free Audit
                </a>
            </div>
        </div>
    </div>
</section>

<!-- Content Pipeline -->
<div class="bg-gh-inset-dark min-h-screen">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 py-16 prose prose-invert prose-blue max-w-none">
        {{ content }}
    </div>
</div>

{% include cta.html %}
