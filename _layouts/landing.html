---
layout: default
---

<!-- Hero Section for Landing Pages -->
<section class="relative py-10 md:py-14 overflow-hidden bg-[#0d1117] border-b border-gh-border-dark">
    <div class="max-w-6xl mx-auto px-4 sm:px-6">
        <div class="max-w-3xl mx-auto text-center reveal">
            <h1 class="text-2xl md:text-3xl font-semibold text-gh-fg-dark mb-6 tracking-tight">
                {{ page.title }}
            </h1>
            {% if page.subtitle %}
            <p class="text-[15px] md:text-[16px] md:text-2xl text-gh-accent mb-6 font-medium">
                {{ page.subtitle }}
            </p>
            {% endif %}
            <p class="text-lg text-gh-muted-dark leading-relaxed mb-10 max-w-2xl mx-auto">
                {{ page.description }}
            </p>
            <div class="flex justify-center gap-4">
                <a href="javascript:void(0)" class="open-calendar px-4 py-2 text-[14px] bg-gh-accent hover:bg-gh-accent/90 text-white font-bold rounded-xl transition-all shadow-sm shadow-gh-accent/20">
                    Get Free Audit
                </a>
            </div>
        </div>
    </div>
</section>

<!-- Content Pipeline -->
<div class="bg-[#010409] min-h-screen">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 py-8 md:py-10 prose prose-invert prose-blue max-w-none">
        {{ content }}
    </div>
</div>

{% include cta.html %}
